<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Ordering | Cari Menu</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="app-shell search-shell">
    <header class="search-topbar">
      <a class="back-button" href="./index.html" aria-label="Kembali ke beranda">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <div class="search-bar search-bar-compact" data-search-focus>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/>
          <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="menuSearch" type="search" placeholder="Cari minuman..." aria-label="Cari minuman">
      </div>
    </header>

    <main class="page-content search-page-content">
      <section class="search-filter-panel" aria-label="Filter kategori menu">
        <div class="search-filter-head">
          <p>Kategori</p>
        </div>
        <div class="search-category-list" id="searchCategoryRow"></div>
      </section>

      <section class="search-result-section">
        <p class="search-result-count" id="resultCount">0 menu ditemukan</p>
        <div class="search-card-list" id="searchMenuList"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navigasi utama">
      <a class="bottom-link" href="./index.html">
        <span class="bottom-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>Home</span>
      </a>
      <a class="bottom-link is-active" href="./all-menu.html">
        <span class="bottom-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/>
            <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span>Cari</span>
      </a>
      <a class="bottom-link" href="./cart.html">
        <span class="bottom-icon with-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 7h13l-1.5 9h-10L7 7Zm0 0-.5-3H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10" cy="20" r="1" fill="currentColor"/>
            <circle cx="17" cy="20" r="1" fill="currentColor"/>
          </svg>
          <span class="badge-count is-empty">0</span>
        </span>
        <span>Keranjang</span>
      </a>
    </nav>
  </div>

  <script src="../../shared/assets/js/api/base-client.js"></script>
  <script src="../assets/js/api/client.js"></script>
  <script src="../assets/js/api/storefront.js"></script>
  <script src="../assets/js/shared/data.js"></script>
  <script src="../../shared/assets/js/api/lenis.min.js"></script>
  <script src="../assets/js/shared/helper.js"></script>
  <script src="../assets/js/pages/menu.js"></script>
</body>
</html>
