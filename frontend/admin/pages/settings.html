<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uncle Joe Admin | Pengaturan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-page-body admin-protected-page" data-admin-page="settings">
    <div class="admin-layout">
        <aside class="admin-sidebar" data-admin-sidebar></aside>

        <main class="admin-content">
            <header class="admin-page-header" data-admin-page-header></header>

            <section class="admin-panel is-panel-tinted" style="max-width: 600px; margin-top: 24px;">
                <div class="admin-panel-head" data-admin-panel-head></div>

                <form id="settingsForm" class="admin-form" style="margin-top: 20px; display: grid; gap: 20px;" novalidate>
                    <label class="admin-field">
                        <span>Pajak Belanja (%)</span>
                        <input type="number" id="settingsTaxPercent" name="tax_percent" min="0" max="100" placeholder="Contoh: 10" required>
                        <small style="color: var(--text-muted); margin-top: 4px; display: block;">Persentase pajak yang dikenakan pada subtotal pesanan.</small>
                    </label>

                    <label class="admin-field">
                        <span>Biaya Layanan (Rp)</span>
                        <input type="number" id="settingsServiceFee" name="service_fee" min="0" placeholder="Contoh: 2000" required>
                        <small style="color: var(--text-muted); margin-top: 4px; display: block;">Nominal tetap biaya layanan tambahan per transaksi.</small>
                    </label>

                    <p class="admin-form-error" id="settingsFormError" style="color: var(--accent-red); font-size: 0.88rem; font-weight: 500;"></p>

                    <div class="admin-form-actions" style="margin-top: 10px;">
                        <button type="submit" class="admin-primary-button" id="saveSettingsButton">Simpan Perubahan</button>
                    </div>
                </form>
            </section>

            <section id="adminUsersSection" class="admin-panel is-panel-tinted is-hidden" style="margin-top: 32px;">
                <div class="admin-panel-head">
                    <div class="admin-panel-heading">
                        <h2>Manajemen Pengguna Admin</h2>
                        <p>Daftar akun admin yang memiliki akses ke panel ini.</p>
                    </div>
                    <div class="admin-panel-side">
                        <button type="button" class="admin-primary-button" id="addAdminUserButton">Tambah Pengguna</button>
                    </div>
                </div>

                <div class="admin-table-wrapper" style="margin-top: 20px;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Nama Lengkap</th>
                                <th>Role</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="adminUsersTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Tambah Admin -->
    <div class="admin-modal-backdrop is-hidden" id="adminUserModal">
        <div class="admin-modal">
            <div class="admin-modal-head">
                <div>
                    <h2>Tambah Pengguna Admin</h2>
                    <p>Buat akun baru untuk staf Anda.</p>
                </div>
                <button type="button" class="admin-icon-button" id="closeAdminUserModal" aria-label="Tutup modal">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <form id="adminUserForm" class="admin-form" novalidate>
                <label class="admin-field">
                    <span>Username</span>
                    <input type="text" id="adminUserUsername" name="username" placeholder="Contoh: budi_kasir" required>
                </label>

                <label class="admin-field">
                    <span>Nama Lengkap</span>
                    <input type="text" id="adminUserFullName" name="fullName" placeholder="Contoh: Budi Santoso" required>
                </label>

                <label class="admin-field">
                    <span>Password</span>
                    <input type="password" id="adminUserPassword" name="password" placeholder="Minimal 6 karakter" required>
                </label>

                <label class="admin-field">
                    <span>Role</span>
                    <select id="adminUserRole" name="role" required>
                        <option value="cashier">Kasir (Cashier)</option>
                        <option value="barista">Barista</option>
                        <option value="admin">Administrator</option>
                    </select>
                </label>

                <p class="admin-form-error" id="adminUserFormError" style="color: var(--accent-red); font-size: 0.88rem; font-weight: 500;"></p>

                <div class="admin-form-actions">
                    <button type="button" class="admin-secondary-button" id="cancelAdminUserButton">Batal</button>
                    <button type="submit" class="admin-primary-button">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ubah Password -->
    <div class="admin-modal-backdrop is-hidden" id="changePasswordModal">
        <div class="admin-modal">
            <div class="admin-modal-head">
                <div>
                    <h2>Ubah Password</h2>
                    <p>Masukkan password baru untuk pengguna ini.</p>
                </div>
                <button type="button" class="admin-icon-button" id="closeChangePasswordModal" aria-label="Tutup modal">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <form id="changePasswordForm" class="admin-form" novalidate>
                <input type="hidden" id="changePasswordUserId">
                
                <label class="admin-field">
                    <span>Password Baru</span>
                    <input type="password" id="changePasswordInput" name="password" placeholder="Minimal 6 karakter" required>
                </label>

                <p class="admin-form-error" id="changePasswordFormError" style="color: var(--accent-red); font-size: 0.88rem; font-weight: 500;"></p>

                <div class="admin-form-actions">
                    <button type="button" class="admin-secondary-button" id="cancelChangePasswordButton">Batal</button>
                    <button type="submit" class="admin-primary-button">Perbarui</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ubah Role -->
    <div class="admin-modal-backdrop is-hidden" id="changeRoleModal">
        <div class="admin-modal">
            <div class="admin-modal-head">
                <div>
                    <h2>Ubah Role Pengguna</h2>
                    <p>Pilih tingkat akses baru untuk pengguna ini.</p>
                </div>
                <button type="button" class="admin-icon-button" id="closeChangeRoleModal" aria-label="Tutup modal">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <form id="changeRoleForm" class="admin-form" novalidate>
                <input type="hidden" id="changeRoleUserId">
                
                <label class="admin-field">
                    <span>Pilih Role</span>
                    <select id="changeRoleInput" name="role" required>
                        <option value="cashier">Kasir (Cashier)</option>
                        <option value="barista">Barista</option>
                        <option value="admin">Administrator</option>
                    </select>
                </label>

                <p class="admin-form-error" id="changeRoleFormError" style="color: var(--accent-red); font-size: 0.88rem; font-weight: 500;"></p>

                <div class="admin-form-actions">
                    <button type="button" class="admin-secondary-button" id="cancelChangeRoleButton">Batal</button>
                    <button type="submit" class="admin-primary-button">Perbarui</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../shared/assets/js/api/base-client.js"></script>
    <script src="../assets/js/api/client.js"></script>
    <script src="../assets/js/api/admin.js"></script>
    <script src="../assets/js/shared/admin-ui.js"></script>
    <script src="../assets/js/shared/store.js"></script>
    <script src="../assets/js/pages/settings.js"></script>
</body>
</html>
